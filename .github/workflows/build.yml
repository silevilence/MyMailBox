name: Windows build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      MYMAILBOX_GRAPH_CLIENT_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      MYMAILBOX_HOME: ${{ runner.temp }}\mymailbox-checks
      MYMAILBOX_GRAPH_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.MYMAILBOX_GRAPH_CLIENT_ID || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Reuse NSIS
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: C:\Program Files (x86)\NSIS
          key: windows-x64-nsis-3.12
      - name: Prepare pinned NSIS when absent
        run: |
          $compiler = 'C:/Program Files (x86)/NSIS/makensis.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install nsis.install --version=3.12.0 --yes --no-progress
            if ($LASTEXITCODE) { throw 'NSIS installation failed' }
          }
          if ((& $compiler /VERSION) -ne 'v3.12') { throw 'NSIS 3.12 required' }
      - name: Validate release metadata for tag builds
        if: github.ref_type == 'tag'
        run: ./scripts/check-release.ps1 -Tag $env:GITHUB_REF_NAME -Phase Tagged -OutputDirectory artifacts/release
      - name: Require application registration for release
        if: github.ref_type == 'tag'
        run: |
          $clientId = [guid]::Empty
          if (![guid]::TryParse($env:MYMAILBOX_GRAPH_CLIENT_ID, [ref]$clientId) -or $clientId -eq [guid]::Empty) { throw 'Configure MYMAILBOX_GRAPH_CLIENT_ID in Actions Secrets before release' }
      - name: Verify and package exact commit
        run: ./scripts/ci-build.ps1 -ExpectedCommit $env:GITHUB_SHA
      - name: Retain validated artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MyMailBox-win-x64-${{ github.sha }}
          path: |
            artifacts/installer/*-setup.exe
            artifacts/installer/SHA256SUMS.txt
            artifacts/installer/build-manifest.json
            artifacts/installer/ci-manifest.json
            artifacts/installer/publish-files.json
            artifacts/release/release-metadata.json
            artifacts/release/release-body.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
